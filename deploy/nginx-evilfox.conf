# =============================================================================
#  EvilFoX loader — vhost nginx  (evilfox.foxhack.fr · OVH)
# -----------------------------------------------------------------------------
#  Deux usages possibles :
#
#  1) vhost complet : copier ce fichier dans /etc/nginx/sites-available/evilfox,
#     ajuster root/ssl, activer le lien symbolique dans sites-enabled/, puis
#     sudo nginx -t && sudo systemctl reload nginx
#
#  2) vhost déjà existant : ne garder que la partie « RÈGLES » ci-dessous et
#     l'inclure dans le server{} en place :
#         include /etc/nginx/snippets/evilfox-site.conf;
#
#  Les en-têtes (dont la Content-Security-Policy et son hash sha256) vivent dans
#  deploy/evilfox-headers.inc → /etc/nginx/snippets/evilfox-headers.inc
#
#  ⚠️  Piège n°1 — CSP et script inline : voir evilfox-headers.inc. Un hash
#      périmé = page totalement inerte (rien ne se sélectionne, rien ne flashe).
#  ⚠️  Piège n°2 — cache : un index.html mis en cache pendant que la CSP attend
#      un autre hash reproduit exactement la même panne. D'où le no-store.
#  ⚠️  Piège n°3 — fichiers manquants : manifest-*.json sont REQUIS (la page
#      travaille toujours en mode « fichier statique », USE_FILE_MANIFEST=true).
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                 # nginx >= 1.25.1 ; sinon : listen 443 ssl http2;
    server_name evilfox.foxhack.fr;

    # racine contenant : index.html · EvilFoX2-0-0.bin · M5EvilFoX1-0-2.bin
    #                    manifest-esp32.json · manifest-m5.json · esp32.png · m5.png
    root  /var/www/evilfox;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/evilfox.foxhack.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/evilfox.foxhack.fr/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    # access_log /var/log/nginx/evilfox.access.log;
    # error_log  /var/log/nginx/evilfox.error.log warn;   # <- « Refused to execute inline script »

    client_max_body_size 16m;

    # ---------------------------- RÈGLES ------------------------------------

    # La page : jamais de cache (sinon vieux HTML + nouvelle CSP = page inerte).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma        "no-cache"                           always;
        expires 0;
        include /etc/nginx/snippets/evilfox-headers.inc;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
        include /etc/nginx/snippets/evilfox-headers.inc;
    }

    # Firmwares : binaire, pas de gzip, téléchargement partiel autorisé
    # (esp-web-tools lit le .bin en entier ; le navigateur affiche la progression).
    location ~* \.bin$ {
        gzip off;
        add_header Accept-Ranges "bytes"                always;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/evilfox-headers.inc;
    }

    # Manifests : le chemin du .bin y est écrit en dur → toujours frais.
    location ~* \.json$ {
        gzip off;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/evilfox-headers.inc;
    }

    # Images / audio : cache long (les .png des boards ne changent pas).
    location ~* \.(png|jpg|jpeg|webp|svg|ico|mp3|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/evilfox-headers.inc;
    }

    # Tout le reste : en-têtes par défaut.
    location / {
        include /etc/nginx/snippets/evilfox-headers.inc;
        try_files $uri $uri/ =404;
    }
}

# --- Redirection HTTP -> HTTPS (Web Serial exige un contexte sécurisé) --------
server {
    listen 80;
    listen [::]:80;
    server_name evilfox.foxhack.fr;
    return 301 https://$host$request_uri;
}
